<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>YoliaWatching 開發測試台</title>
  <style>
    :root {
      --bg:      #111;
      --panel:   #1e1e1e;
      --border:  #2e2e2e;
      --text:    #bbb;
      --accent:  #4af;
      --green:   #4c4;
      --red:     #f44;
      --code-bg: #0a0a0a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: monospace; font-size: 13px; line-height: 1.6; }

    /* leave right side clear for fixed character */
    #app { padding: 18px; padding-right: 420px; }

    h1 { color: #fff; font-size: 17px; margin-bottom: 16px; }
    h2 { color: var(--accent); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin: 14px 0 8px; }

    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; }

    /* ── Commands table ──────────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; }
    th { color: #555; font-weight: normal; text-align: left; padding: 3px 10px; border-bottom: 1px solid var(--border); }
    td { padding: 4px 10px; }
    tr[onclick] { cursor: pointer; }
    tr[onclick]:hover td { background: #1a2a1a; }
    tr[onclick]:active td { background: #0f1f0f; }
    .tag { display: inline-block; padding: 1px 7px; border-radius: 3px; background: #2a2a2a; border: 1px solid #444; font-size: 11px; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .nil { color: #444; }

    /* ── Code blocks ─────────────────────────────────────────────────────── */
    pre {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px;
      padding: 10px 12px; font-size: 12px; color: #9f9; white-space: pre; overflow-x: auto;
      line-height: 1.55;
    }
    code { color: #9f9; }

    /* ── Chat simulator ──────────────────────────────────────────────────── */
    #chat-log {
      height: 180px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 8px; background: #0c0c0c;
      display: flex; flex-direction: column; gap: 2px;
      margin-bottom: 8px;
    }
    .msg { padding: 2px 7px; border-radius: 3px; }
    .m-chat { color: #666; }
    .m-cmd  { color: var(--green); background: #0f1f0f; }
    .m-info { color: var(--accent); }

    #chat-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #yuushi-slider { flex: 1; min-width: 80px; accent-color: var(--accent); }
    #slider-label  { min-width: 36px; color: #fff; }

    #chat-row { display: flex; gap: 8px; margin-top: 8px; }
    #chat-input {
      flex: 1; background: #0c0c0c; border: 1px solid var(--border);
      border-radius: 4px; color: #fff; padding: 6px 10px;
      font-family: monospace; font-size: 13px;
    }
    #chat-input:focus { outline: none; border-color: var(--accent); }

    button {
      background: #222; border: 1px solid var(--border); color: var(--text);
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-family: monospace; font-size: 12px; white-space: nowrap;
    }
    button:hover { background: #2e2e2e; }
    .btn-accent { border-color: var(--accent); color: var(--accent); }

    /* ── Fixed character (same as OBS overlay) ───────────────────────────── */
    #character { position: fixed; bottom: 60px; right: 40px; cursor: grab; }
    #char-canvas { display: block; }

    #hud {
      position: fixed;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: rgba(0,0,0,0.82); border-radius: 14px; padding: 7px 14px 9px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #hud > span { color: #fff; font-size: 13px; font-family: monospace; font-weight: bold; white-space: nowrap; }
    #bar-track { width: 80px; height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
    #bar-fill  { height: 100%; width: 0%; background: #4af; border-radius: 3px; transition: width .3s; }
    #bar-fill.peek  { background: #fa4; }
    #bar-fill.angry { background: #f44; }

    #speech-bubble {
      max-width: 160px; word-break: break-all;
      background: rgba(255,255,255,0.92); color: #222;
      font-size: 12px; border-radius: 8px; padding: 4px 9px;
      opacity: 0; transition: opacity 0.3s;
    }
    #speech-bubble.show { opacity: 1; }

  </style>
</head>
<body>
<div id="app">

  <h1>YoliaWatching 開發測試台</h1>

  <!-- ── 目前指令（動態載入）──────────────────────────────────────────── -->
  <div class="panel">
    <h2>目前指令 <span style="color:#444;text-transform:none;font-size:10px;letter-spacing:0">— commands.json（頁面重整自動更新）</span></h2>
    <table>
      <thead><tr><th>指令</th><th>動畫狀態</th><th>幽視值變化</th></tr></thead>
      <tbody id="cmd-tbody"><tr><td colspan="3" class="nil" style="padding:6px 10px">載入中…</td></tr></tbody>
    </table>
  </div>

  <!-- ── 聊天模擬器 ───────────────────────────────────────────────────── -->
  <div class="panel">
    <h2>聊天模擬器</h2>
    <div id="chat-controls">
      <span>幽視</span>
      <input id="yuushi-slider" type="range" min="0" max="100" value="0">
      <span id="slider-label">0%</span>
      <button class="btn-accent" onclick="randomCmd()">隨機指令</button>
      <button onclick="resetState()">重設</button>
    </div>
    <div id="chat-log"></div>
    <div id="chat-row">
      <input id="chat-input" placeholder="輸入聊天訊息或指令，例如 !跳…" autofocus>
      <button onclick="sendMsg()">送出</button>
    </div>
  </div>

</div><!-- /#app -->

<!-- Character (fixed, same as OBS overlay) -->
<div id="hud">
  <div id="speech-bubble"></div>
  <span>yolia_see <span id="yolia-see-val">0</span>%</span>
  <div id="bar-track"><div id="bar-fill"></div></div>
</div>
<div id="character"><canvas id="char-canvas"></canvas></div>

<script src="/renderer/character.js"></script>
<script>
  // ── Character ──────────────────────────────────────────────────────────────
  const canvas   = document.getElementById('char-canvas');
  const ctx      = canvas.getContext('2d');
  const charEl   = document.getElementById('character');
  const hudEl    = document.getElementById('hud');
  const valEl    = document.getElementById('yolia-see-val');
  const barFill  = document.getElementById('bar-fill');
  const speechEl = document.getElementById('speech-bubble');

  const char = createCharacter({
    canvas, ctx, charEl, valEl, barFill, speechEl,
    assetBase: '/assets/sprites/frames',
    onUpdateHud({ posRight, posBottom, jumpOffset, canvasW, canvasH }) {
      const hudW = hudEl.offsetWidth || 100;
      hudEl.style.right  = (posRight + canvasW / 2 - hudW / 2) + 'px';
      hudEl.style.bottom = (posBottom + jumpOffset + canvasH + 8) + 'px';
    },
  });
  char.scheduleWander();

  // ── State ─────────────────────────────────────────────────────────────────
  let yolia_see    = 0;
  let interactions = [];

  function buildHandlers() {
    const thresholds = interactions.filter(i => i.trigger === 'threshold');
    const keywords   = interactions.filter(i => i.trigger === 'keyword');
    const cmdMap     = {};
    for (const i of interactions.filter(i => i.trigger === 'command')) {
      const keys = Array.isArray(i.match) ? i.match : (i.match ? [i.match] : []);
      for (const k of keys) cmdMap[k] = i;
    }
    let keywordRe = null;
    if (keywords.length) {
      const allWords = keywords.flatMap(i => Array.isArray(i.match) ? i.match : [i.match]);
      const escaped  = allWords.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      keywordRe = new RegExp(escaped.join('|'));
    }
    return { thresholds, keywords, cmdMap, keywordRe };
  }

  function computeState() {
    const sorted = interactions.filter(i => i.trigger === 'threshold').sort((a, b) => b.min - a.min);
    for (const s of sorted) {
      if (yolia_see >= s.min) return s.state;
    }
    return 'idle';
  }

  function applyYoliaSee(v) {
    yolia_see = Math.max(0, Math.min(100, v));
    slider.value = yolia_see;
    sliderLabel.textContent = yolia_see + '%';
  }

  // ── Slider ─────────────────────────────────────────────────────────────────
  const slider      = document.getElementById('yuushi-slider');
  const sliderLabel = document.getElementById('slider-label');

  slider.addEventListener('input', () => {
    applyYoliaSee(parseInt(slider.value));
    char.applyUpdate({ value: yolia_see, state: computeState() });
  });

  function resetState() {
    applyYoliaSee(0);
    char.applyUpdate({ value: yolia_see, state: computeState() });
    addLog('重設 yolia_see → 0%', 'info');
  }

  // ── Config loader ──────────────────────────────────────────────────────────
  async function loadConfig() {
    try {
      const [petCfg, cmdData] = await Promise.all([
        fetch('/panel/api/pet-config').then(r => r.json()),
        fetch('/commands.json').then(r => r.json()),
      ]);
      interactions = petCfg.interactions ?? [];
      if (petCfg.greetingAnimations?.length) char.setWaveVariants(petCfg.greetingAnimations);
      if (cmdData.animations && Object.keys(cmdData.animations).length) char.setAnimations(cmdData.animations);
      renderTable();
    } catch {
      document.getElementById('cmd-tbody').innerHTML =
        '<tr><td colspan="3" class="neg" style="padding:6px 10px">' +
        '無法載入設定 — 請透過 OBS server 開啟（http://localhost:3000/renderer/test.html）</td></tr>';
    }
  }

  function renderTable() {
    const { cmdMap } = buildHandlers();
    const rows = Object.entries(cmdMap).map(([cmd, cfg]) => {
      const y    = cfg.yolia_see ?? 0;
      const cost = cfg.cost ?? null;
      const yStr = y > 0 ? `<span class="pos">+${y}</span>`
                 : y < 0 ? `<span class="neg">${y}</span>`
                 : '<span class="nil">—</span>';
      const costStr = cost != null ? ` <span class="neg">消耗 ${cost}</span>` : '';
      const aStr = cfg.animation ? `<span class="tag">${cfg.animation}</span>` : '<span class="nil">—</span>';
      const escaped = cmd.replace(/'/g, "\\'");
      return `<tr onclick="processMessage('${escaped}')"><td><strong>${cmd}</strong></td><td>${aStr}</td><td>${yStr}${costStr}</td></tr>`;
    });
    document.getElementById('cmd-tbody').innerHTML =
      rows.length ? rows.join('') : '<tr><td colspan="3" class="nil">（無指令）</td></tr>';
  }

  // ── Chat simulator ─────────────────────────────────────────────────────────
  const chatLog = document.getElementById('chat-log');

  function addLog(text, type = 'chat') {
    const el = document.createElement('div');
    el.className = `msg m-${type}`;
    el.textContent = text;
    chatLog.appendChild(el);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function processMessage(raw, username = 'viewer') {
    raw = raw.trim();
    if (!raw) return;

    const { cmdMap, keywords, keywordRe } = buildHandlers();
    const word = raw.split(' ')[0];
    const cmd  = cmdMap[word];

    if (cmd) {
      if (cmd.cost !== undefined && yolia_see < cmd.cost) {
        const speech = `${username} 幽視值不足，需要 ${cmd.cost}！`;
        char.applyUpdate({ value: yolia_see, state: computeState(), speech });
        addLog(`✗ ${word} — 幽視值不足 (需要 ${cmd.cost}，目前 ${yolia_see})`, 'info');
        setTimeout(() => char.applyUpdate({ value: yolia_see, state: computeState() }), 3000);
        return;
      }
      if (cmd.cost      !== undefined) applyYoliaSee(yolia_see - cmd.cost);
      if (cmd.yolia_see !== undefined) applyYoliaSee(yolia_see + cmd.yolia_see);
      const speech = cmd.response ? cmd.response.replace('{user}', username) : `${username}: ${word}`;
      const anim   = cmd.animation ?? computeState();
      addLog(`⚡ ${word}  →  anim: ${anim}  yolia_see: ${yolia_see}%`, 'cmd');
      char.applyUpdate({ value: yolia_see, state: anim, animOnly: !!cmd.animation, speech });
      if (cmd.animation) setTimeout(() => char.applyUpdate({ value: yolia_see, state: computeState() }), 3000);
      return;
    }

    // Non-command: +1
    applyYoliaSee(yolia_see + 1);
    const matched = keywordRe ? raw.match(keywordRe)?.[0] : null;
    if (matched) {
      const kw = keywords.find(i => (Array.isArray(i.match) ? i.match : [i.match]).includes(matched));
      if (kw?.yolia_see) applyYoliaSee(yolia_see + kw.yolia_see);
      const speech = (kw?.response ?? '').replace('{user}', username).replace('{word}', matched) || `${username} ${matched}`;
      addLog(`🔑 ${matched}  →  anim: ${kw?.animation ?? 'wave'}  yolia_see: ${yolia_see}%`, 'cmd');
      char.applyUpdate({ value: yolia_see, state: kw?.animation ?? 'wave', animOnly: true, speech });
    } else {
      addLog(`${username}: ${raw}`, 'chat');
      char.applyUpdate({ value: yolia_see, state: computeState() });
    }
  }

  function sendMsg() {
    const input = document.getElementById('chat-input');
    processMessage(input.value);
    input.value = '';
    input.focus();
  }

  function randomCmd() {
    const { cmdMap } = buildHandlers();
    const keys = Object.keys(cmdMap);
    if (!keys.length) { addLog('尚未載入指令', 'info'); return; }
    const pick = keys[Math.floor(Math.random() * keys.length)];
    addLog(`隨機：${pick}`, 'info');
    processMessage(pick);
  }

  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
  });

  // ── WebSocket (hot-reload from panel settings) ────────────────────────────
  (function connectWS() {
    const ws = new WebSocket(`ws://${location.hostname}:${location.port || 3000}`);
    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (data.reloadCommands)               { loadConfig(); return; }
      if (data.setWaveVariants !== undefined) { char.setWaveVariants(data.setWaveVariants); return; }
      if (data.setScale !== undefined)        { char.setScale(data.setScale); return; }
      if (data.setAnimations !== undefined)   { char.setAnimations(data.setAnimations); return; }
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  })();

  // ── Init ───────────────────────────────────────────────────────────────────
  loadConfig();
  addLog('測試台就緒。輸入指令測試，或拖動幽視滑桿觀察狀態。', 'info');
</script>
</body>
</html>
